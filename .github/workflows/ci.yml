name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Config ${{ matrix.pair.config }} / Detector ${{ matrix.pair.detector }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        pair:
          - { config: '3', detector: '1' }
          - { config: '4', detector: '1' }
          - { config: '4', detector: '2' }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict

      - name: Install published dependencies
        run: >-
          composer update --with="componenta/config:^${{ matrix.pair.config }}.0"
          --with="componenta/mimetype-detector:^${{ matrix.pair.detector }}.0"
          --no-interaction --no-progress --prefer-dist

      - run: composer show componenta/mimetype-detector
      - run: composer test
      - run: composer audit --no-dev
