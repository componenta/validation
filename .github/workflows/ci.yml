name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / config v${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        config: ['2', '3']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout config v3 workspace
        if: matrix.config == '3'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/config
          ref: main
          path: .ci/config

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict

      - name: Pin config v2
        if: matrix.config == '2'
        run: composer require --no-update componenta/config:^2.0.2

      - name: Use config v3 workspace
        if: matrix.config == '3'
        run: >-
          composer config repositories.componenta-config
          '{"type":"path","url":".ci/config","options":{"symlink":false,"versions":{"componenta/config":"3.0.0"}}}'

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
